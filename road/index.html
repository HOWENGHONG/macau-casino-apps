<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#160706"><title>百家樂記路</title>
<style>:root{--gold:#e9c46a;--gold2:#f7dc8f;--B:#d7263d;--P:#1e5bd8;--T:#1f9d4c;--c:20px;
  --font:"Noto Sans TC","Noto Sans CJK TC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#12070a;color:#fff;font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto auto;grid-template-areas:"hdr" "ban" "board" "stats" "pred" "pad";
  background:radial-gradient(ellipse at 50% 0%,rgba(233,196,106,.16),transparent 55%),repeating-linear-gradient(45deg,rgba(255,215,120,.03) 0 6px,transparent 6px 18px),#150709}
#hdr{grid-area:hdr;display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#2a0f0a,#160706);border-bottom:2px solid #7a5a22}
#hdr .t{font-weight:900;font-size:20px;color:var(--gold2);letter-spacing:2px;white-space:nowrap}
#shoeInfo{font-size:14px;color:#e2cfa6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hbtn{border:1px solid #a07b3a;background:linear-gradient(#5a3a1a,#34200e);color:#f5e2b8;border-radius:10px;padding:8px 11px;white-space:nowrap;font-size:15px;font-weight:700;min-height:40px}
#ban{grid-area:ban;display:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:#3d2a05;color:#ffe9a8;font-size:14px}
#ban.show{display:flex}
#board{grid-area:board;min-height:0;min-width:0;overflow:hidden;padding:6px 6px 0;display:grid;gap:4px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start;
  grid-template-areas:"big big" "bead bead" "eye eye" "small roach"}
.road{position:relative;min-width:0;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px #8a6a2a}
.road .sc{overflow-x:auto;overflow-y:hidden;height:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.road .sc::-webkit-scrollbar{display:none}
.road svg{display:block}
.road .rl{position:absolute;right:3px;bottom:1px;font-size:10px;color:#8a8a8a;font-weight:700;pointer-events:none;opacity:.6}
#rBig{grid-area:big}#rBead{grid-area:bead}#rEye{grid-area:eye}#rSmall{grid-area:small}#rRoach{grid-area:roach}
.pv{animation:blink .45s infinite alternate}
@keyframes blink{to{opacity:.1}}
.nw{animation:blink .4s 4 alternate}
#stats{grid-area:stats;min-width:0;display:flex;gap:8px;padding:6px 8px;align-items:stretch}
#counts{flex:1;font-size:13px;line-height:1.45;color:#f3e3c0;background:#120b05;border:1px solid #6b5020;border-radius:8px;padding:5px 8px;min-width:0}
#counts .r{display:flex;gap:4px 7px;flex-wrap:wrap;align-items:center;white-space:nowrap}
#counts b{color:#fff;font-variant-numeric:tabular-nums}
#counts .sm{color:#bda57a;font-size:.9em}
.dot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;margin-right:2px;vertical-align:-3px}
.dot.B{background:var(--B)}.dot.P{background:var(--P)}.dot.T{background:var(--T)}
#asks{display:flex;flex-direction:column;gap:6px;width:132px}
.ask{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:10px;border:2px solid;font-weight:800;font-size:14px;min-height:40px;touch-action:none}
.ask.B{background:rgba(215,38,61,.22);border-color:#ff9a9a;color:#ffd0d0}.ask.P{background:rgba(30,91,216,.22);border-color:#9dbaff;color:#d3e0ff}
.ask.on{box-shadow:0 0 0 3px #ffe066}
.ask svg{background:#fff;border-radius:3px}
#pad{grid-area:pad;padding:4px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.toggles,.mains,.utils{display:flex;gap:8px}
.tg{flex:1;min-height:46px;border-radius:12px;border:2px dashed rgba(233,196,106,.7);font-size:17px;font-weight:800;color:#f1dfb4;background:rgba(0,0,0,.3)}
.tg[data-f=bp].on{background:var(--B);border:2px solid #fff;color:#fff}
.tg[data-f=pp].on{background:var(--P);border:2px solid #fff;color:#fff}
.tg[data-f=s6].on{background:linear-gradient(#f6d77a,#c7942b);border:2px solid #fff;color:#3a2300}
.big{flex:1;min-height:96px;border-radius:18px;font-size:44px;font-weight:900;color:#fff;border:3px solid rgba(255,255,255,.85);box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.3);letter-spacing:4px;position:relative}
.big small{display:block;font-size:13px;letter-spacing:2px;opacity:.85;font-weight:700}
.big.B{background:linear-gradient(#e8394f,#9d1022)}.big.P{background:linear-gradient(#3571ee,#123c9c)}.big.T{background:linear-gradient(#29b35a,#0e6230);flex:.7}
.big:active,.big.pressed{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.ubtn{flex:1;min-height:48px;border-radius:12px;border:2px solid #a07b3a;background:linear-gradient(#5a3a1a,#34200e);font-size:18px;font-weight:800;color:#f5e2b8}
.ubtn:disabled,.big:disabled,.tg:disabled{opacity:.35}
#toast{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--gold);color:#fff3cf;padding:10px 20px;border-radius:22px;font-size:16px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80;white-space:nowrap}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.ov.show{display:flex}
.dlg{background:linear-gradient(#2b1409,#170a04);border:2px solid var(--gold);border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center}
.dlg h3{margin:0 0 8px;color:var(--gold2);font-size:20px}.dlg p{margin:0 0 16px;font-size:16px;color:#f3e6cc;line-height:1.5}
.dlg .row{display:flex;gap:10px}
.dlg .row button{flex:1;min-height:50px;border-radius:12px;font-size:18px;font-weight:800;border:2px solid #a07b3a;background:linear-gradient(#5a3a1a,#34200e);color:#f5e2b8}
.dlg .row button.ok{background:linear-gradient(#c62b2b,#7a1010);border-color:#ffadad;color:#fff}
#hist .dlg{max-height:88vh;display:flex;flex-direction:column;text-align:left}
#histList{overflow:auto;flex:1;margin:6px 0 12px;-webkit-overflow-scrolling:touch}
.hi{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid rgba(233,196,106,.25)}
.hi .info{flex:1;cursor:pointer}.hi .info b{color:var(--gold2)}.hi .info div{font-size:13px;color:#d8c7a2;margin-top:2px}
.hi .del{border:1px solid #a05050;color:#ffb3b3;border-radius:8px;padding:6px 10px;font-size:14px}
.hi.cur .info b::after{content:" · 本靴";color:#8ef0ad;font-weight:400}
.empty{color:#bda57a;text-align:center;padding:20px}
body.viewing #pad .big,body.viewing #pad .tg,body.viewing #bUndo{opacity:.3;pointer-events:none}
/* prediction panel */
#pred{grid-area:pred;min-width:0;margin:0 8px 2px;padding:4px 8px 3px;background:#0f0a14;border:1px solid #5b4a7a;border-radius:8px}
#pred .ph{display:flex;align-items:center;gap:8px;min-height:30px}
#pred .pt{font-weight:900;color:#d9c8ff;font-size:14px;white-space:nowrap}
#pSum{flex:1;font-size:13px;color:#e8e0f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pSum .pk{margin:0 3px}
.pk{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 3px;border-radius:10px;font-size:12px;font-weight:900;color:#fff;background:#555}
.pk.B{background:var(--B)}.pk.P{background:var(--P)}.pk.N{background:#4a4458;color:#cfc6de}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#4a4458;flex:none;transition:background .15s}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#ddd;transition:left .15s}
.sw.on{background:#2fae62}.sw.on i{left:25px;background:#fff}
#pChips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:3px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;min-height:36px;padding:2px 3px;border-radius:7px;background:#1d1628;border:1px solid #3d3355;font-size:12px;color:#e3dbf2;min-width:0;white-space:nowrap}
.chip .cn{overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:700}.chip .cv{display:flex;align-items:center;gap:3px}.chip .pk{min-width:18px;height:18px;font-size:11px}.chip .hr{color:#a89cc2;font-size:11px;font-variant-numeric:tabular-nums}
.chip.off{opacity:.35}
.pnote{font-size:11px;color:#9b90b3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pred.off #pChips,#pred.off .pnote{display:none}
#pred.off #pSum{color:#8d84a3}
#pcfg .dlg,#about .dlg{max-height:90vh;display:flex;flex-direction:column;text-align:left}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px;border-bottom:1px solid rgba(233,196,106,.3);font-size:16px;font-weight:700;color:#f3e6cc}
#pList{overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.pm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(233,196,106,.18)}
.pm .nm{font-weight:800;color:var(--gold2);font-size:15px}.pm .ds{grid-column:2/4;font-size:12px;color:#cdbd9a;line-height:1.4}
.pm .rt{font-size:13px;color:#f3e6cc;text-align:right;white-space:nowrap}.pm .rt small{color:#bda57a}
.pm.all{background:rgba(233,196,106,.08);border-radius:8px}
.pm.off .nm,.pm.off .rt{opacity:.45}
.disc{font-size:13px!important;color:#e0cfa5!important;background:rgba(0,0,0,.35);border-left:3px solid var(--gold);padding:8px 10px;margin:10px 0 12px!important;text-align:left;line-height:1.5!important}
.abody{overflow:auto;flex:1;min-height:0;margin:0 0 12px;font-size:14px;line-height:1.6;color:#f0e2c4}
.abody h4{margin:10px 0 2px;color:var(--gold2);font-size:15px}.abody ul{margin:2px 0;padding-left:20px}
/* short portrait phones (e.g. 360x640): compact prediction row, smaller pad */
@media (orientation:portrait) and (max-height:700px){
  #hdr{padding:5px 10px}#hdr .t{font-size:18px}.hbtn{min-height:36px;padding:5px 10px}
  #pred{padding:2px 6px}#pred .ph{min-height:26px}.sw{width:44px;height:24px}.sw i{width:18px;height:18px}.sw.on i{left:23px}
  #pChips{grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-top:2px}.chip{min-height:30px;font-size:11px;padding:1px 1px;gap:0}
  .chip .hr{display:none}.chip .pk{min-width:15px;height:15px;font-size:10px}.pnote{display:none}
  #stats{padding:4px 8px}#counts{font-size:12px;line-height:1.35}.ask{min-height:34px}
  #pad{gap:6px}.tg{min-height:40px}.big{min-height:70px;font-size:36px}.ubtn{min-height:42px}
}
/* landscape */
@media (orientation:landscape) and (max-height:560px){
  #app{grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"hdr pad" "ban pad" "board pad" "stats pad" "pred pad"}
  #hdr{padding:4px 10px}#hdr .t{font-size:17px}.hbtn{min-height:34px;padding:4px 12px}
  #board{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-areas:"bead big big big" "eye eye small roach";padding:4px 4px 0}
  #rEye{grid-area:eye}
  #pad{padding:6px 8px;justify-content:center;border-left:2px solid #7a5a22;background:rgba(0,0,0,.25)}
  .mains{flex-direction:column}.big{min-height:64px;font-size:34px;flex:1!important}.big small{display:inline;margin-left:6px}
  .big.T{min-height:48px}
  .tg{min-height:40px;font-size:15px}.ubtn{min-height:42px;font-size:16px}
  #pred{margin:0 4px 3px;padding:2px 6px}#pred .ph{min-height:24px}#pred .pt{font-size:12px}#pSum{font-size:12px}
  .sw{width:44px;height:24px}.sw i{width:18px;height:18px}.sw.on i{left:23px}
  #pChips{grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-top:2px}.chip{min-height:22px;font-size:11px;gap:0;padding:1px 2px}
  .chip .hr{font-size:10px}.chip .pk{min-width:15px;height:15px;font-size:10px}.pnote{display:none}
  #stats{padding:4px}#counts{font-size:12px;line-height:1.35;padding:3px 8px}#asks{flex-direction:row;width:230px}.ask{min-height:36px}
}
#bRoom.inroom{background:linear-gradient(#1d6b3a,#0e3d20);border-color:#6fe39a;color:#dfffe9;font-variant-numeric:tabular-nums;letter-spacing:1px}
#bRoom.recon{background:linear-gradient(#8a5a10,#4d3006);border-color:#ffc861;animation:blink .6s infinite alternate}
#room .dlg{max-height:92vh;overflow:auto;text-align:left}
.rmf{display:flex;align-items:center;gap:10px;margin:4px 0 10px}.rmf label{font-weight:800;color:var(--gold2);white-space:nowrap}
#room input{flex:1;min-width:0;min-height:44px;border-radius:10px;border:2px solid #a07b3a;background:#0e0704;color:#fff;font-size:18px;padding:0 10px;font-family:inherit;user-select:text;-webkit-user-select:text}
#rmCode{text-transform:uppercase;letter-spacing:3px;font-weight:800}
.rmsec{border-top:1px solid rgba(233,196,106,.3);padding:10px 0 8px}.rmsec>b{display:block;color:var(--gold2);margin-bottom:8px}
.rmseg{display:flex;gap:6px;margin-bottom:8px}.rmseg button{flex:1;min-height:40px;border-radius:10px;border:2px solid #6b5020;color:#d8c7a2;font-weight:700;font-size:14px}
.rmseg button.on{border-color:#6fe39a;background:rgba(47,174,98,.25);color:#fff}
.rmrow{display:flex;gap:8px;margin:6px 0}
.rmbig{min-height:46px;padding:0 16px;border-radius:12px;border:2px solid #a07b3a;background:linear-gradient(#5a3a1a,#34200e);font-size:17px;font-weight:800;color:#f5e2b8;flex:1}
.rmbig.ok{background:linear-gradient(#c62b2b,#7a1010);border-color:#ffadad;color:#fff;width:100%}
.rmnote{font-size:12px!important;color:#bda57a!important;margin:6px 0 10px!important;line-height:1.5!important}
.rmerr{color:#ffb3b3!important;font-weight:700;font-size:14px!important}
.rmwait{text-align:center;font-size:17px!important;padding:16px 0}
.rmcode{display:flex;align-items:baseline;gap:10px;justify-content:center}.rmcode span{color:#bda57a}.rmcode b{font-size:34px;letter-spacing:5px;color:#fff;font-variant-numeric:tabular-nums}
.rmcode .st{font-style:normal;font-size:13px;color:#8ef0ad}.rmcode .st.reconnecting{color:#ffc861}
.rmqr{display:flex;justify-content:center;margin:6px 0}.rmqr svg{width:150px;height:150px;background:#fff;border-radius:8px}
.rmmode{color:#f3e6cc}
#rmList{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto}#rmList li{padding:5px 2px;border-bottom:1px solid rgba(233,196,106,.15);color:#f3e6cc}
#rmList li i{font-style:normal;font-size:12px;background:#7a5a22;border-radius:6px;padding:1px 6px;margin-left:4px}#rmList li i.me{background:#1d6b3a}
#rmList li.off{opacity:.5}
body.room-ro #pad .big,body.room-ro #pad .tg,body.room-ro #bUndo,body.room-ro #bNew{opacity:.3}
#confirm{z-index:95}
#bRoom.inroom{padding:6px 9px;font-size:14px}
@media (max-width:480px){body.inroom #hdr .t{display:none}}

<style id="pwa-css">/* ===== iOS PWA layer (shared) ===== */
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,a{-webkit-user-drag:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* road app: safe-area padding on the whole grid */
#app{padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#pad{padding-bottom:8px}

<body>
<div id="app">
  <header id="hdr"><div class="t">百家樂記路</div><div id="shoeInfo"></div><button class="hbtn" id="bHist">歷史</button><button class="hbtn" id="bAbout">說明</button></header>
  <div id="ban"><span id="banTxt"></span><button class="hbtn" id="bBack">返回本靴</button></div>
  <main id="board">
    <div class="road" id="rBig"><div class="sc"></div><span class="rl">大路</span></div>
    <div class="road" id="rBead"><div class="sc"></div><span class="rl">珠盤路</span></div>
    <div class="road" id="rEye"><div class="sc"></div><span class="rl">大眼仔</span></div>
    <div class="road" id="rSmall"><div class="sc"></div><span class="rl">小路</span></div>
    <div class="road" id="rRoach"><div class="sc"></div><span class="rl">曱甴路</span></div>
  </main>
  <section id="stats">
    <div id="counts"></div>
    <div id="asks"><button class="ask B" data-w="B" id="askB"></button><button class="ask P" data-w="P" id="askP"></button></div>
  </section>
  <section id="pred">
    <div class="ph"><span class="pt">多方面預測</span><span id="pSum"></span><button class="sw" id="pSw" aria-label="預測開關"><i></i></button></div>
    <div id="pChips"></div>
    <div class="pnote" id="pNote">※ 只屬路紙規律參考，無法抵銷莊家優勢 · 撳此看詳情</div>
  </section>
  <section id="pad">
    <div class="toggles"><button class="tg" data-f="pp">閒對</button><button class="tg" data-f="s6">幸運6</button><button class="tg" data-f="bp">莊對</button></div>
    <div class="mains"><button class="big P" data-w="P">閒<small>PLAYER</small></button><button class="big T" data-w="T">和<small>TIE</small></button><button class="big B" data-w="B">莊<small>BANKER</small></button></div>
    <div class="utils"><button class="ubtn" id="bUndo">撤銷</button><button class="ubtn" id="bNew">新靴</button></div>
  </section>
  <div class="ov" id="confirm"><div class="dlg"><h3 id="cTitle"></h3><p id="cText"></p><div class="row"><button id="cNo">取消</button><button class="ok" id="cYes">確定</button></div></div></div>
  <div class="ov" id="hist"><div class="dlg"><h3>牌靴紀錄</h3><div id="histList"></div><div class="row"><button id="hClear">清除全部紀錄</button><button class="ok" id="hClose">關閉</button></div></div></div>
  <div class="ov" id="pcfg"><div class="dlg"><h3>多方面預測</h3>
    <div class="mrow"><span>顯示預測面板</span><button class="sw" id="pSw2" aria-label="預測總開關"><i></i></button></div>
    <div id="pList"></div>
    <p class="disc" id="pDisc"></p>
    <div class="row"><button class="ok" id="pClose">關閉</button></div></div></div>
  <div class="ov" id="about"><div class="dlg"><h3>說明</h3><div class="abody" id="aBody"></div><div class="row"><button class="ok" id="aClose">關閉</button></div></div></div>
  <div id="toast"></div>
</div>

<script id="bac-core">
(function (root) {
  'use strict';

      h += '<p class="rmwait">' + esc(R.pending) + '</p><div class="row"><button id="rmCancel">取消</button></div>';
    } else {
      var url = U.shareUrl('road/', R.code), isHost = R.role === 'host';
      h += '<div class="rmcode"><span>房號</span><b id="rmCodeTxt">' + R.code + '</b><em class="st ' + R.status + '">' + stText() + '</em></div>' +
        '<div class="rmqr">' + U.qrSvg(url) + '</div>' +
        '<div class="rmrow"><button class="rmbig" id="rmShare">分享連結</button><button class="rmbig" id="rmCopy">複製房號</button></div>' +
        '<div class="rmsec"><b>輸入權限</b>' + (isHost ? '<div class="rmseg" id="rmMode2"><button data-m="host"' + (R.mode === 'host' ? ' class="on"' : '') + '>只限房主輸入</button><button data-m="all"' + (R.mode === 'all' ? ' class="on"' : '') + '>所有人可輸入</button></div>'
          : '<div class="rmmode">' + (R.mode === 'all' ? '所有人可輸入' : '只限房主輸入') + '</div>') + '</div>' +
        '<div class="rmsec"><b>房內裝置（' + R.players.length + '/7）</b><ul id="rmList">' + R.players.map(function (p) {
          return '<li class="' + (p.on ? '' : 'off') + '">' + esc(p.name) + (p.host ? ' <i>房主</i>' : '') + (p.pid === R.me ? ' <i class="me">你</i>' : '') + (p.on ? '' : ' <small>離線</small>') + '</li>';
        }).join('') + '</ul></div>' +
        '<div class="row"><button id="rmLeave">' + (isHost ? '解散房間' : '離開房間') + '</button><button class="ok" id="rmClose">關閉</button></div>';
    }
    b.innerHTML = h;
    var on = function (id, f) { var e = $(id); if (e) e.onclick = f; };
    on('rmClose', hide); on('rmCancel', function () { leave(true); renderPanel(); });
    var mode = 'host';
    document.querySelectorAll('#rmMode button').forEach(function (x) { x.onclick = function () { mode = x.dataset.m; document.querySelectorAll('#rmMode button').forEach(function (y) { y.classList.toggle('on', y === x); }); }; });
    document.querySelectorAll('#rmMode2 button').forEach(function (x) { x.onclick = function () { setMode(x.dataset.m); }; });
    on('rmHost', function () { U.setName($('rmName').value); host(mode); });
    on('rmJoin', function () { U.setName($('rmName').value); var c = M.normCode($('rmCode').value); if (!c) { renderPanel('房號應為 6 位英文字母／數字'); return; } join(c); });
    on('rmShare', function () { U.share('一齊記路：房號 ' + R.code, U.shareUrl('road/', R.code)).then(function (r) { if (r === 'copied') A.toast('已複製邀請連結'); }); });
    on('rmCopy', function () { U.copy(R.code).then(function (ok) { A.toast(ok ? '已複製房號 ' + R.code : '房號：' + R.code); }); });
    on('rmLeave', function () {
      hide(); A.ask(isHostNow() ? '解散房間？' : '離開房間？', isHostNow() ? '其他裝置會返回各自的單機記路。' : '本房牌靴會存入你的牌靴紀錄，然後返回單機記路。', isHostNow() ? '解散' : '離開').then(function (ok) { if (ok) { leave(); A.toast('已離開房間'); } });
    });
  }
  function isHostNow() { return R && R.role === 'host'; }
  function stText() { return { online: '已連線', reconnecting: '重新連線中…', connecting: '連線中…' }[R.status] || ''; }
  function pill() {
    btn.classList.toggle('inroom', !!R && !R.pending); btn.classList.toggle('recon', !!R && R.status === 'reconnecting');
    btn.textContent = R && !R.pending ? '● ' + R.code : '聯機';
    document.body.classList.toggle('inroom', !!R && !R.pending);
    document.body.classList.toggle('room-ro', !!R && !R.pending && R.role === 'client' && R.mode !== 'all');
  }
  function refresh() { pill(); if (ov.classList.contains('show')) renderPanel(); }

  // ---------- host ----------
  function hostState(by, act) { return { t: 'state', rev: ++R.rev, mode: R.mode, shoe: A.T.state.current, by: by || '', act: act || '' }; }
  function playersMsg() {
    var list = [{ pid: R.me, name: R.name, host: true, on: true }].concat(R.ledger.list().map(function (p) { return { pid: p.pid, name: p.name, host: false, on: R.net.online(p.pid) }; }));
    R.players = list; return { t: 'players', list: list };
  }
  function host(mode) {
    if (!Net.available()) { renderPanel(U.errText('browser-incompatible')); return; }
    var name = U.getName() || '房主', id = Net.identity('road');
    R = { role: 'host', mode: mode === 'all' ? 'all' : 'host', name: M.cleanName(name), me: id.pid, rev: 0, players: [], status: 'connecting', pending: '正在開房…', ledger: new M.Ledger(M.MAX_PLAYERS - 1) };
    renderPanel();
    var h = R.net = new Net.Host('road', PREFIX, { onHello: function (m) { return R.ledger.join(m); } }), me = R;
    h.on('join', function (pid, m, rejoin) {
      if (R !== me) return;
      h.send(pid, { t: 'welcome', you: pid, code: me.code, host: me.name });
      h.broadcast(playersMsg()); h.send(pid, hostState());
      A.toast(R.ledger.get(pid).name + (rejoin ? ' 已重新連線' : ' 加入了房間')); refresh();
    });
    h.on('msg', function (pid, m) {
      if (R !== me) return; var p = me.ledger.get(pid); if (!p) return;
      if (m.t === 'add' || m.t === 'undo' || m.t === 'newShoe') {
        if (!M.roadApply(A.T, me.mode, false, m)) { h.send(pid, { t: 'deny', why: me.mode === 'all' ? 'noop' : 'host-only' }); return; }
        announce(p.name, m); A.render();
      }
    });
    h.on('drop', function (pid) { if (R !== me) return; var p = me.ledger.get(pid); h.broadcast(playersMsg()); if (p) A.toast(p.name + ' 已離線'); refresh(); });
    h.on('error', function () {});
    h.start().then(function (code) {
      if (R !== me) { h.close(); return; }
      me.code = code; me.pending = null; me.status = 'online'; playersMsg(); A.room = api; refresh(); A.toast('房間已開：' + code);
    }, function (e) { if (R !== me) return; R = null; renderPanel(U.errText(e)); pill(); });
  }
  function announce(by, m) {
    if (m.t === 'add') A.justAdded = true;
    R.net.broadcast(hostState(by, m.t === 'add' ? m.w : m.t));
    if (by !== R.name || m.t !== 'add') A.toast(actText(by, m.t === 'add' ? m.w : m.t));
  }
  function actText(by, act) { return by + '：' + ({ B: '莊', P: '閒', T: '和', undo: '撤銷上一局', newShoe: '開始新靴' }[act] || act); }
  function setMode(m) { R.mode = m === 'all' ? 'all' : 'host'; R.net.broadcast(hostState()); refresh(); }

  // ---------- client ----------
  var pendingCode = null;
  function mirror() {
    var local = A.local, t = new TC.Tracker({ get: function () { return null; }, set: function () { local.save(); } });
    t.state.prefs = local.state.prefs; return t;
  }
  function join(code) {
    if (!Net.available()) { renderPanel(U.errText('browser-incompatible')); return; }
    var id = Net.identity('road'), name = M.cleanName(U.getName() || '玩家');
    R = { role: 'client', code: code, mode: 'host', name: name, me: id.pid, rev: -1, players: [], status: 'connecting', pending: '正在加入房間 ' + code + '…' };
    renderPanel();
    var c = R.net = new Net.Client('road', PREFIX, code, { t: 'hello', v: 1, app: 'road', pid: id.pid, tok: id.tok, name: name }), me = R;
    c.on('msg', function (m) { if (R === me) onHost(m); });
    c.on('status', function (s) { if (R !== me || me.pending) return; me.status = s; refresh(); if (s === 'reconnecting') A.toast('連線中斷，正在重新連線…'); });
    c.on('rejoined', function () { if (R === me) A.toast('已重新連線'); });
    c.on('closed', function (why) { if (R !== me) return; var had = A.T.hands().length; leave(true); A.ask('已離開房間', U.errText(why) + '。' + (had ? '本房牌靴已存入你的牌靴紀錄，' : '') + '已返回單機記路。', '知道了'); });
    c.start().then(function () {
      if (R !== me) return; me.pending = null; me.status = 'online'; me.tracker = mirror(); A.setT(me.tracker); A.room = api;
      try { sessionStorage.setItem('mroad.room', code); } catch (e) {}
      hide(); refresh(); A.render(); A.toast('已加入房間 ' + code);
    }, function (e) { if (R !== me) return; R = null; pill(); renderPanel(U.errText(e)); if (!ov.classList.contains('show')) A.toast(U.errText(e)); });
  }
  function onHost(m) {
    if (m.t === 'state') {
      var s = M.cleanRoadState(m); if (!s || s.rev <= R.rev) return;
      R.rev = s.rev; var modeChanged = R.mode !== s.mode; R.mode = s.mode;
      if (!R.tracker) R.pendingState = s;
      else applyState(s, m.by, m.act);
      if (modeChanged) { refresh(); if (R.tracker) A.toast(R.mode === 'all' ? '房主已開放所有人輸入' : '房主已設定只限房主輸入'); }
    } else if (m.t === 'players' && Array.isArray(m.list)) {
      R.players = m.list.slice(0, 7).map(function (p) { return { pid: String(p.pid || ''), name: M.cleanName(p.name), host: !!p.host, on: !!p.on }; }); refresh();
    } else if (m.t === 'deny') A.toast(m.why === 'host-only' ? '只有房主可以輸入' : '無法執行');
  }
  function applyState(s, by, act) {
    var t = R.tracker, cur = t.state.current;
    if (cur.id !== s.shoe.id && cur.hands.length && cur.id !== 'room0') { cur.ended = Date.now(); t.state.past.unshift(cur); }
    t.state.current = s.shoe; t.state.shoeNo = s.shoe.no;
    if (act === 'B' || act === 'P' || act === 'T') A.justAdded = true;
    A.render();
    if (by && by !== R.name) A.toast(actText(M.cleanName(by), act));
  }
  // intercept local input while in a room
  var api = {
    act: function (m) {
      if (!R || R.pending) return false;
      if (R.role === 'host') { if (M.roadApply(A.T, R.mode, true, m)) announce(R.name, m); return true; }
      if (R.mode !== 'all') { A.toast('只有房主可以輸入'); return true; }
      if (!R.net.send(m)) A.toast('未連線，請稍候');
      return true;
    }
  };
  // Buffer states that arrive before the mirror exists (welcome -> state ordering)
  var _setT = A.setT; A.setT = function (t) { _setT(t); if (R && R.pendingState) { var s = R.pendingState; R.pendingState = null; t.state.current = s.shoe; t.state.shoeNo = s.shoe.no; } };
  function leave(silent) {
    var r = R; if (!r) return; R = null; A.room = null;
    try { sessionStorage.removeItem('mroad.room'); } catch (e) {}
    if (r.net) { try { r.net.close(); } catch (e) {} }
    if (r.role === 'client' && r.tracker) {
      var local = A.local, keep = [r.tracker.state.current].concat(r.tracker.state.past).filter(function (s) { return s.hands.length; });
      keep.forEach(function (s) { s.id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); s.ended = s.ended || Date.now(); });
      if (keep.length) { local.state.past = keep.concat(local.state.past).slice(0, TC.MAX_PAST); local.save(); }
      A.setT(local);
    }
    pill(); if (ov.classList.contains('show')) renderPanel(); A.render();
  }
  window.addEventListener('pagehide', function () { if (R && R.role === 'host') try { R.net.close(); } catch (e) {} });
  var back = window.onAndroidBack;
  window.onAndroidBack = function () { if (ov.classList.contains('show')) { hide(); return true; } return back ? back() : false; };
  A.roomApi = { host: host, join: join, leave: leave, show: show, get: function () { return R; } };
  // deep link #join=CODE, or silent rejoin after a reload
  var hc = U.hashCode();
  if (hc) { pendingCode = hc; show(); }
  else { var rc = null; try { rc = sessionStorage.getItem('mroad.room'); } catch (e) {} if (rc && M.normCode(rc)) join(rc); }
})();
</script>
